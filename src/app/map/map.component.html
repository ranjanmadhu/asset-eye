<div class="flex-1 relative w-full h-full bg-slate-100 overflow-y-auto p-4 md:p-8 space-y-8" style="background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px); background-size: 24px 24px;">

  <div class="fixed top-20 right-6 z-20 bg-white/90 backdrop-blur p-3 border border-slate-200 rounded-md shadow-sm hidden md:block">
    <div class="space-y-2 text-[10px] uppercase font-bold text-slate-600">
      <div class="flex items-center gap-2"><span class="w-3 h-3 bg-blue-500 rounded-full border border-blue-600"></span> Active Path</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 bg-blue-400 rounded-full"></span> Room</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 bg-gray-400 rounded-full"></span> Corridor</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 bg-rose-500 rounded-full"></span> Elevator</div>
    </div>
  </div>

  @for (floor of floors(); track floor) {
    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden flex flex-col relative shrink-0 max-w-4xl mx-auto">
      <!-- Header -->
      <div class="h-12 bg-slate-900 text-white flex items-center px-6 shrink-0 justify-between">
        <h3 class="font-bold text-sm tracking-wider flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="text-blue-400" viewBox="0 0 24 24"><path d="M11.99 2.5L2.5 7l9.49 4.5L21.5 7zM2.5 11l9.49 4.5L21.5 11M2.5 16l9.49 4.5L21.5 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          FLOOR 0{{ floor }}
        </h3>
        <span class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Elevation: L{{ floor }}</span>
      </div>

      <!-- Map -->
      <div class="w-full h-[400px] md:h-[500px] flex items-center justify-center p-4 bg-slate-50 relative">
        <svg width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" class="w-full h-full drop-shadow-sm">
          <defs>
            <marker [id]="'arrow-active-' + floor" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6" />
            </marker>
          </defs>
          
          <!-- Building Walls (Areas) -->
          @for (area of getAreasForFloor(floor); track area.id) {
            <rect 
              [attr.x]="area.x"
              [attr.y]="area.y"
              [attr.width]="area.width"
              [attr.height]="area.height"
              [attr.fill]="area.type === 'room' ? '#ffffff' : (area.type === 'elevator' ? '#fef2f2' : '#f8fafc')"
              stroke="#64748b"
              stroke-width="6"
              rx="4"
            />
          }

          <!-- Background Edges -->
          @for (edge of getEdgesForFloor(floor); track edge.source + '-' + edge.target) {
            @if (getNodeDetails(edge.source); as sourceNode) {
              @if (getNodeDetails(edge.target); as targetNode) {
                <line 
                  [attr.x1]="sourceNode.x" 
                  [attr.y1]="sourceNode.y" 
                  [attr.x2]="targetNode.x" 
                  [attr.y2]="targetNode.y"
                  stroke="#cbd5e1"
                  stroke-width="3"
                  stroke-linecap="round"
                />
              }
            }
          }

          <!-- Active Path Segments -->
          @for (seg of getActiveSegmentsForFloor(floor); track seg.source.id + '-' + seg.target.id) {
            <polyline 
              [attr.points]="seg.source.x + ',' + seg.source.y + ' ' + seg.midX + ',' + seg.midY + ' ' + seg.target.x + ',' + seg.target.y"
              stroke="#3b82f6"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
              [attr.marker-mid]="'url(#arrow-active-' + floor + ')'"
            />
          }

          <!-- Nodes -->
          @for (node of getNodesForFloor(floor); track node.id) {
            <g>
              <circle 
                [attr.cx]="node.x" 
                [attr.cy]="node.y" 
                [attr.r]="isNodeActive(node.id) ? '12' : (node.type === 'room' ? '8' : '6')"
                [attr.fill]="isNodeActive(node.id) ? '#2563eb' : getNodeColor(node.type)"
                [attr.stroke]="isNodeActive(node.id) ? '#bfdbfe' : '#ffffff'"
                [attr.stroke-width]="isNodeActive(node.id) ? '4' : '2'"
                class="transition-all duration-300 shadow-sm"
              />
              <text 
                [attr.x]="node.x" 
                [attr.y]="node.y - 18" 
                text-anchor="middle"
                class="text-xs font-bold fill-slate-700 select-none drop-shadow-sm"
              >
                {{ node.name }}
              </text>
            </g>
          }
        </svg>
      </div>
    </div>
  }
</div>
