<div class="max-w-3xl mx-auto">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Feed Upload</h2>
    <p class="text-sm text-slate-500 mt-1">Submit a camera frame to the asset imagery library</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6">
    <label
      class="flex flex-col items-center justify-center gap-3 border-2 border-dashed rounded-lg p-10 cursor-pointer transition-colors"
      [class.border-blue-500]="dragging()"
      [class.bg-blue-50]="dragging()"
      [class.border-slate-300]="!dragging()"
      [class.bg-slate-50]="!dragging()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave()"
      (drop)="onDrop($event)"
    >
      <mat-icon class="!w-8 !h-8 text-[32px] text-slate-400">cloud_upload</mat-icon>
      <span class="text-sm font-semibold text-slate-700">Drop an image here or click to browse</span>
      <span class="text-xs text-slate-400">PNG, JPEG, WEBP or GIF &middot; max 10 MB</span>
      <input
        type="file"
        class="hidden"
        accept="image/png,image/jpeg,image/webp,image/gif"
        (change)="onFileInput($event)"
      />
    </label>

    @if (previewUrl(); as preview) {
      <div class="mt-6 flex gap-4 items-center">
        <img [src]="preview" alt="Selected frame preview" class="w-28 h-28 object-cover rounded border border-slate-200" />
        <div class="min-w-0">
          <p class="font-semibold text-sm text-slate-800 truncate">{{ file()?.name }}</p>
          <p class="text-xs text-slate-500 mt-0.5">{{ ((file()?.size || 0) / 1024) | number: '1.0-0' }} KB</p>
          <button
            (click)="clear()"
            class="mt-2 text-xs font-semibold text-slate-500 hover:text-red-600 cursor-pointer"
          >Remove</button>
        </div>
      </div>
    }

    @if (error(); as err) {
      <p class="mt-4 text-sm font-medium text-red-600 bg-red-50 border border-red-100 rounded px-3 py-2">{{ err }}</p>
    }

    @if (storedName(); as name) {
      <p class="mt-4 text-sm font-medium text-emerald-700 bg-emerald-50 border border-emerald-100 rounded px-3 py-2">
        Stored as <span class="font-mono">{{ name }}</span> in src/data-images
      </p>
    }

    <button
      (click)="upload()"
      [disabled]="!file() || uploading()"
      class="mt-6 w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold py-2.5 rounded text-sm transition-colors shadow-sm cursor-pointer"
    >
      {{ uploading() ? 'Uploading...' : 'Upload Frame' }}
    </button>
  </div>
</div>
